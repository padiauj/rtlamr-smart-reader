configuration:
  meters:
    name: Meters
    description: List of ERT endpoint IDs and per-meter reading/filter settings.
  lock_center_hz:
    name: Lock center frequency
    description: Frequency used for normal listening, in Hz.
  lock_sample_rate:
    name: Lock sample rate
    description: RTL-SDR sample rate used by rtl_tcp and rtlamr.
  lock_symbol_length:
    name: Symbol length
    description: rtlamr symbol length used when decoding meter packets.
  stale_seconds:
    name: Stale seconds
    description: Enter scan mode after this many seconds without a confirmed packet from any configured meter.
  lock_restart_seconds:
    name: Lock restart seconds
    description: Restart the lock receiver after this many seconds to keep the SDR session fresh.
  receiver_startup_timeout_seconds:
    name: Receiver startup timeout
    description: Seconds to wait for rtl_tcp to tune before treating startup as failed.
  receiver_failure_backoff_seconds:
    name: Receiver failure backoff
    description: Initial seconds to wait before retrying after USB, tuner, or decoder startup failures.
  receiver_failure_backoff_max_seconds:
    name: Maximum receiver backoff
    description: Maximum seconds to wait between repeated receiver recovery attempts.
  scan_seconds:
    name: Scan seconds
    description: Seconds to dwell on each scan frequency while reacquiring stale meters.
  scan_backoff_seconds:
    name: Scan backoff seconds
    description: Delay before retrying a scan when no stale meter is reacquired.
  scan_centers_hz:
    name: Scan centers
    description: Frequencies to try when reacquiring stale meters.
  tuner_gain:
    name: Tuner gain
    description: RTL-SDR tuner gain in dB.
  overload_restart_threshold:
    name: Overload restart threshold
    description: Restart the receiver after this many rtlamr not-keeping-up warnings in one session. Use 0 to disable.
  overload_min_rate_ratio:
    name: Overload minimum rate ratio
    description: Count an rtlamr not-keeping-up warning as severe only below this fraction of the configured sample rate.
  sample_interval_seconds:
    name: Sample interval
    description: Seconds between retained SQLite samples and MQTT sample publishes.
  retention_days:
    name: Retention days
    description: Number of days of raw samples to keep in the add-on SQLite database.
  database_path:
    name: Database path
    description: SQLite database path for retained raw samples.
  store_unchanged_samples:
    name: Store unchanged samples
    description: Store every interval even when the accepted reading has not changed.
  base_topic:
    name: MQTT base topic
    description: Base MQTT topic used for state and attributes.
  discovery_prefix:
    name: MQTT discovery prefix
    description: Home Assistant MQTT discovery prefix.
  discovery_interval:
    name: Discovery interval
    description: Seconds between periodic MQTT discovery republishes.
  retain_state:
    name: Retain MQTT state
    description: Retain meter state topics on the MQTT broker.
  force_update:
    name: Force update
    description: Ask Home Assistant to record repeated sensor states.
  daily_report_enabled:
    name: Daily email report
    description: Send one email report per day with usage summaries and plots.
  daily_report_time:
    name: Daily report time
    description: Local HH:MM time to send the report. The report covers the previous completed midnight-to-midnight day.
  daily_report_timezone:
    name: Daily report timezone
    description: Timezone used for report scheduling and midnight day boundaries. Leave blank to use the add-on TZ setting.
  daily_report_recipients:
    name: Daily report recipients
    description: Email addresses that receive the daily usage report.
  daily_report_sender:
    name: Daily report sender
    description: From address used for report emails.
  daily_report_subject_prefix:
    name: Daily report subject prefix
    description: Text prefix used in the email subject line.
  daily_report_month_days:
    name: Report month days
    description: Number of trailing days to include in the daily-usage chart.
  daily_report_retry_seconds:
    name: Report retry seconds
    description: Seconds to wait before retrying after an email delivery failure.
  daily_report_state_path:
    name: Report state path
    description: Path used to remember the last successfully sent report date.
  smtp_host:
    name: SMTP host
    description: Mail server hostname used for daily reports.
  smtp_port:
    name: SMTP port
    description: Mail server port used for daily reports.
  smtp_username:
    name: SMTP username
    description: Optional SMTP login username.
  smtp_password:
    name: SMTP password
    description: Optional SMTP login password or app password.
  smtp_starttls:
    name: SMTP STARTTLS
    description: Upgrade the SMTP connection with STARTTLS after connecting.
  smtp_ssl:
    name: SMTP SSL
    description: Use implicit TLS from the start of the SMTP connection.
  smtp_timeout_seconds:
    name: SMTP timeout
    description: Seconds to wait for SMTP connections and commands.
  log_level:
    name: Log level
    description: Add-on logging verbosity.
